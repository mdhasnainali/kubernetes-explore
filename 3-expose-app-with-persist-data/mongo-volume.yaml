apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
  labels:
    app: mongo
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce # one node mounts it read-write
  persistentVolumeReclaimPolicy: Retain # keep data after the PVC is deleted
  storageClassName: manual # opt out of dynamic provisioning
  hostPath:
    path: /data/mongo # directory on the minikube node
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual # must match the PV, else the default class provisions a new one
  resources:
    requests:
      storage: 1Gi
