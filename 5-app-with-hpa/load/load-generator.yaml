# Load generator — deliberately in a subdirectory so `kubectl apply -f .` in the lesson
# root does NOT start hammering the app. Apply it explicitly:
#
#   kubectl apply -f load/load-generator.yaml
#   kubectl scale deployment load-generator --replicas=8   # turn up the heat
#   kubectl delete -f load/load-generator.yaml             # stop, then watch scale-down
#
# Each pod is a tight request loop against the ClusterIP Service, so traffic spreads
# across every webapp pod — including the ones the HPA adds mid-test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O /dev/null http://webapp-service:3000/ || true; done"
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
