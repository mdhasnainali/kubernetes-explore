apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner # nothing provisions: PVs are hand-written below
volumeBindingMode: WaitForFirstConsumer # bind only once a pod needs it, so the scheduler picks the node first
reclaimPolicy: Retain

---
# One PV per node. Each is a directory on that specific node, pinned with nodeAffinity,
# so a pod that binds this PV can only be scheduled onto that node.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv-0
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/mongo
    type: DirectoryOrCreate # create the dir on first mount instead of failing
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube

